name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar que el catálogo sea JSON correcto
        run: |
          python - <<'FIN'
          import json
          total = 0
          for nombre in ["becas", "maestrias", "doctorados", "diplomados", "instituciones"]:
              datos = json.load(open(f"data/{nombre}.json", encoding="utf-8"))
              assert isinstance(datos, list) and datos, nombre
              assert all(d.get("id") and d.get("nombre") for d in datos), nombre
              print(f"{nombre}: {len(datos)} registros")
              total += len(datos)
          for nombre in ["meta", "meta_catalogo"]:
              json.load(open(f"data/{nombre}.json", encoding="utf-8"))

          enlaces = json.load(open("data/enlaces.json", encoding="utf-8"))
          print("enlaces:", json.dumps(enlaces["resumen"], ensure_ascii=False))
          for grupo in ("instituciones", "becas"):
              for clave, info in enlaces[grupo].items():
                  assert info["url"].startswith("http"), (grupo, clave)
          print("total:", total)
          FIN

      - name: Verificar que el catálogo generado esté al día
        run: |
          python scraper/generar_catalogo.py
          git diff --exit-code data/maestrias.json data/doctorados.json                                data/diplomados.json data/instituciones.json

      - name: Probar el extractor de requisitos
        run: |
          pip install -r scraper/requirements.txt
          python scraper/test_extraccion.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
