name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar que el catálogo sea JSON correcto
        run: |
          python -c "import json;d=json.load(open('data/becas.json'));print(len(d),'becas válidas')"
          python -c "import json;json.load(open('data/meta.json'));print('meta.json ok')"

      - name: Probar el extractor de requisitos
        run: |
          pip install -r scraper/requirements.txt
          python scraper/test_extraccion.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
