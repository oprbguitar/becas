name: Actualizar catálogo

# El rastreo corre en los servidores de GitHub: no consume nada del equipo
# del usuario ni requiere intervención manual.
on:
  schedule:
    - cron: "0 6 * * 1"      # cada lunes a las 06:00 UTC (01:00 en Perú)
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      limite:
        description: "Rastrear solo las N primeras becas (0 = todas)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: actualizar-becas
  cancel-in-progress: false

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Probar el extractor antes de rastrear
        run: python scraper/test_extraccion.py

      - name: Rastrear convocatorias oficiales
        run: python scraper/scrape.py --limite ${{ github.event.inputs.limite || 0 }}

      - name: Regenerar catálogo de posgrados
        run: python scraper/generar_catalogo.py

      # Comprueba que cada enlace publicado abra de verdad y, cuando la ruta
      # declarada falla, descubre la sección real de posgrado leyendo la
      # portada. Los runners de GitHub alcanzan sitios que bloquean otras redes.
      - name: Validar y reparar enlaces
        run: python -u scraper/validar_enlaces.py --hilos 16
        continue-on-error: true

      - name: Publicar cambios del catálogo
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Sin cambios en el catálogo."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "datos: actualización automática del catálogo y los enlaces"
          git push
